<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Хронограф 2.0 — СК Скорпион</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#2a313c;
    --txt:#e6edf3; --dim:#8b949e;
    --green:#2ea043; --yellow:#d29922; --red:#da3633;
    --accent:#1f6feb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt);
    min-height:100vh; display:flex; flex-direction:column;
    padding:14px; gap:14px; user-select:none;
  }

  /* ---------- Шапка ---------- */
  header{display:flex; align-items:center; justify-content:space-between;}
  .logo{display:flex; align-items:center; gap:8px;}
  .logo-mark{
    width:30px;height:30px;border-radius:8px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:#fff;
  }
  .logo-text{font-weight:700;font-size:15px;letter-spacing:.3px;}
  .logo-sub{font-size:11px;color:var(--dim);}
  .ver{font-size:11px;color:var(--dim);}

  /* ---------- Панели ---------- */
  .panel{
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:14px;
  }
  .label{
    font-size:11px; text-transform:uppercase; letter-spacing:.8px;
    color:var(--dim); margin-bottom:10px; font-weight:600;
  }

  /* ---------- Слайдер веса ---------- */
  .weight-value{
    display:flex; align-items:baseline; gap:6px; margin-bottom:12px;
  }
  .weight-value b{font-size:30px; font-weight:800;}
  .weight-value span{font-size:14px; color:var(--dim);}

  .slider-track{
    position:relative; height:44px; border-radius:12px;
    background:#0a0d12; border:1px solid var(--line);
    touch-action:none; cursor:pointer; overflow:hidden;
  }
  .slider-fill{
    position:absolute; top:0; left:0; bottom:0;
    background:linear-gradient(90deg,#1f6feb55,#1f6feb99);
    width:0%; pointer-events:none;
  }
  .slider-thumb{
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width:26px; height:26px; border-radius:50%;
    background:#fff; box-shadow:0 0 0 3px #1f6feb, 0 2px 8px #000a;
    pointer-events:none;
  }
  .slider-marks{
    display:flex; justify-content:space-between;
    font-size:10px; color:var(--dim); margin-top:6px; padding:0 2px;
  }
  .fine-badge{
    margin-top:8px; font-size:11px; color:var(--accent);
    opacity:0; transition:opacity .15s; text-align:center; font-weight:600;
  }
  .fine-badge.on{opacity:1;}

  /* ---------- Выбор оружия ---------- */
  .weapons{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .weapon{
    background:#0a0d12; border:1px solid var(--line);
    border-radius:10px; padding:10px; text-align:left;
    color:var(--txt); font-size:13px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .weapon .limit{display:block; font-size:11px; color:var(--dim); margin-top:3px;}
  .weapon.active{border-color:var(--accent); background:#1f6feb1a;}
  .weapon.active .limit{color:var(--accent);}

  /* ---------- Режим площадки ---------- */
  .modes{display:flex; gap:8px;}
  .mode{
    flex:1; padding:10px; border-radius:10px; text-align:center;
    background:#0a0d12; border:1px solid var(--line);
    color:var(--txt); font-size:13px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .mode.active{border-color:var(--accent); background:#1f6feb1a; font-weight:600;}

  /* ---------- Ввод скорости ---------- */
  .speed-row{display:flex; align-items:center; gap:12px;}
  .speed-input{
    flex:1; background:#0a0d12; border:1px solid var(--line);
    border-radius:12px; padding:14px; font-size:34px; font-weight:800;
    color:var(--txt); text-align:center; width:100%;
    outline:none; -moz-appearance:textfield;
  }
  .speed-input::-webkit-outer-spin-button,
  .speed-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .speed-input:focus{border-color:var(--accent);}
  .speed-unit{font-size:15px; color:var(--dim); font-weight:600;}

  /* ---------- Результат ---------- */
  .result{
    border-radius:14px; padding:16px; border:1px solid var(--line);
    background:var(--panel); transition:border-color .2s, background .2s;
  }
  .result .status{font-size:12px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;}
  .result .big{font-size:40px; font-weight:800; margin:4px 0;}
  .result .equiv{font-size:13px; color:var(--dim);}
  .result .note{font-size:12px; margin-top:8px; line-height:1.4;}
  .result.green{border-color:var(--green); background:#2ea04314;}
  .result.green .status{color:var(--green);}
  .result.yellow{border-color:var(--yellow); background:#d2992214;}
  .result.yellow .status{color:var(--yellow);}
  .result.red{border-color:var(--red); background:#da363314;}
  .result.red .status{color:var(--red);}

  /* ---------- Футер ---------- */
  footer{
    margin-top:auto; text-align:center; font-size:11px;
    color:var(--dim); line-height:1.5; padding-top:6px;
  }
  footer b{color:var(--txt);}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">С</div>
    <div>
      <div class="logo-text">Хронограф 2.0</div>
      <div class="logo-sub">СК «Скорпион»</div>
    </div>
  </div>
  <div class="ver">v2.0</div>
</header>

<!-- Вес шара -->
<section class="panel">
  <div class="label">Вес шара</div>
  <div class="weight-value">
    <b id="weightOut">0.20</b><span>г</span>
  </div>
  <div class="slider-track" id="track">
    <div class="slider-fill" id="fill"></div>
    <div class="slider-thumb" id="thumb"></div>
  </div>
  <div class="slider-marks">
    <span>0.12</span><span>0.20</span><span>0.30</span><span>0.40</span><span>0.50</span>
  </div>
  <div class="fine-badge" id="fineBadge">Точная настройка · шаг 0.001 г</div>
</section>

<!-- Тип оружия -->
<section class="panel">
  <div class="label">Тип оружия</div>
  <div class="weapons" id="weapons">
    <button class="weapon active" data-limit="100">Пистолет / револьвер<span class="limit">до 100 м/с</span></button>
    <button class="weapon" data-limit="120">Пистолет-пулемёт<span class="limit">до 120 м/с</span></button>
    <button class="weapon" data-limit="130">Автомат / штурмовая<span class="limit">до 130 м/с</span></button>
    <button class="weapon" data-limit="130">Помповое ружьё<span class="limit">до 130 м/с</span></button>
    <button class="weapon" data-limit="172">Снайперская винтовка<span class="limit">до 172 м/с</span></button>
  </div>
</section>

<!-- Режим площадки -->
<section class="panel">
  <div class="label">Условия игры</div>
  <div class="modes" id="modes">
    <button class="mode active" data-mode="open">Открытая площадка</button>
    <button class="mode" data-mode="cqb">Здание / CQB</button>
  </div>
</section>

<!-- Ввод скорости -->
<section class="panel">
  <div class="label">Замер скорости</div>
  <div class="speed-row">
    <input class="speed-input" id="speed" type="number" inputmode="decimal" placeholder="0" min="0" max="250" step="0.1">
    <div class="speed-unit">м/с</div>
  </div>
</section>

<!-- Результат -->
<section class="result" id="result">
  <div class="status" id="status">Введите скорость</div>
  <div class="big" id="big">— м/с</div>
  <div class="equiv" id="equiv"></div>
  <div class="note" id="note"></div>
</section>

<footer>
  Приложение принадлежит <b>СК «Скорпион»</b><br>
  Правила: СК ЮФО · база 0,20 г · допуск +5 м/с
</footer>

<script>
/* ================= КОНСТАНТЫ ПРАВИЛ ================= */
const BASE_WEIGHT = 0.20;   // эталонный вес правил, г
const TOLERANCE   = 5;      // допуск +5 м/с
const CQB_LIMIT   = 130;    // потолок для зданий
const PISTOL_LIMIT= 100;    // пистолеты в здании тоже 100

/* ================= СЛАЙДЕР ВЕСА ================= */
const MIN_W = 0.12, MAX_W = 0.50;
const track = document.getElementById('track');
const fill  = document.getElementById('fill');
const thumb = document.getElementById('thumb');
const weightOut = document.getElementById('weightOut');
const fineBadge = document.getElementById('fineBadge');

let weight = 0.20;
let dragging = false;
let lastX = 0, lastT = 0, lastSpeed = 0;

function wToPct(w){ return ((w - MIN_W) / (MAX_W - MIN_W)) * 100; }
function pctToW(p){ return MIN_W + (p / 100) * (MAX_W - MIN_W); }

function renderWeight(){
  const p = wToPct(weight);
  fill.style.width = p + '%';
  thumb.style.left = p + '%';
  weightOut.textContent = weight.toFixed(3).replace(/0+$/,'').replace(/\.$/,'') || '0';
  // всегда 2 знака минимум для читаемости
  weightOut.textContent = weight.toFixed(weight < 0.1 ? 3 : 3).replace(/(\.\d\d)0$/,'$1');
  updateResult();
}

function setFromEvent(e){
  const rect = track.getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
  const raw = pctToW((x / rect.width) * 100);

  // определяем скорость движения пальца
  const now = performance.now();
  const dt = Math.max(now - lastT, 1);
  const dx = Math.abs(e.clientX - lastX);
  const pxPerMs = dx / dt;
  lastX = e.clientX; lastT = now;

  // замедление → тонкий шаг
  const fine = pxPerMs < 0.08;   // медленное движение
  fineBadge.classList.toggle('on', fine);

  const step = fine ? 0.001 : 0.01;
  weight = Math.round(raw / step) * step;
  weight = Math.min(Math.max(weight, MIN_W), MAX_W);
  weight = Math.round(weight * 1000) / 1000;

  renderWeight();
}

track.addEventListener('pointerdown', e=>{
  dragging = true;
  track.setPointerCapture(e.pointerId);
  lastX = e.clientX; lastT = performance.now();
  setFromEvent(e);
});
track.addEventListener('pointermove', e=>{ if(dragging) setFromEvent(e); });
track.addEventListener('pointerup', e=>{
  dragging = false;
  fineBadge.classList.remove('on');
});
track.addEventListener('pointercancel', ()=>{
  dragging = false;
  fineBadge.classList.remove('on');
});

/* двойной тап — сброс на стандартный вес */
let lastTap = 0;
track.addEventListener('pointerup', e=>{
  const now = Date.now();
  if(now - lastTap < 300){
    // ближайший стандартный
    const std = [0.20,0.25,0.30,0.40,0.43];
    weight = std.reduce((a,b)=> Math.abs(b-weight)<Math.abs(a-weight)?b:a, std[0]);
    renderWeight();
  }
  lastTap = now;
});

/* ================= ВЫБОР ОРУЖИЯ ================= */
let weaponLimit = 100;
let weaponName  = 'Пистолет / револьвер';
document.getElementById('weapons').addEventListener('click', e=>{
  const btn = e.target.closest('.weapon');
  if(!btn) return;
  document.querySelectorAll('.weapon').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  weaponLimit = parseFloat(btn.dataset.limit);
  weaponName  = btn.childNodes[0].textContent.trim();
  updateResult();
});

/* ================= РЕЖИМ ПЛОЩАДКИ ================= */
let mode = 'open';
document.getElementById('modes').addEventListener('click', e=>{
  const btn = e.target.closest('.mode');
  if(!btn) return;
  document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  mode = btn.dataset.mode;
  updateResult();
});

/* ================= ВВОД СКОРОСТИ ================= */
const speedInput = document.getElementById('speed');
speedInput.addEventListener('input', updateResult);

/* ================= ЛОГИКА РЕЗУЛЬТАТА ================= */
const resultEl = document.getElementById('result');
const statusEl = document.getElementById('status');
const bigEl    = document.getElementById('big');
const equivEl  = document.getElementById('equiv');
const noteEl   = document.getElementById('note');

function updateResult(){
  const v = parseFloat(speedInput.value);

  if(isNaN(v) || v <= 0){
    resultEl.className = 'result';
    statusEl.textContent = 'Введите скорость';
    bigEl.textContent = '— м/с';
    equivEl.textContent = '';
    noteEl.textContent = '';
    return;
  }

  // Эквивалент скорости при эталонном весе 0,20 г (по энергии)
  // E = m*v^2/2 → v_eq = v * sqrt(m / m_base)
  const vEq = v * Math.sqrt(weight / BASE_WEIGHT);

  // Определяем действующий лимит
  let limit = weaponLimit;
  let limitReason = weaponName;

  if(mode === 'cqb'){
    if(weaponName.startsWith('Пистолет')){
      limit = PISTOL_LIMIT;
      limitReason = 'Пистолет в здании';
    } else {
      limit = CQB_LIMIT;
      limitReason = 'Здание / CQB — потолок 130 м/с';
    }
  }

  // Сравниваем фактическую скорость с лимитом
  // (правила привязаны к скорости при 0,20 г, поэтому сравниваем эквивалент)
  const compare = vEq;
  const yellowMax = limit + TOLERANCE;

  bigEl.textContent = v.toFixed(1) + ' м/с';
  equivEl.textContent = weight !== BASE_WEIGHT
    ? `Эквивалент при 0,20 г: ${vEq.toFixed(1)} м/с`
    : '';

  if(compare <= limit){
    resultEl.className = 'result green';
    statusEl.textContent = 'ДОПУСК';
    noteEl.textContent = `В пределах лимита (${limitReason}: до ${limit} м/с).`;
  } else if(compare <= yellowMax){
    resultEl.className = 'result yellow';
    statusEl.textContent = 'НА ГРАНИЦЕ';
    noteEl.textContent = `Превышение в пределах допуска +${TOLERANCE} м/с (${limitReason}: до ${limit} м/с).`;
  } else {
    resultEl.className = 'result red';
    statusEl.textContent = 'НАРУШЕНИЕ';
    noteEl.textContent = `Превышен лимит (${limitReason}: до ${limit} м/с). К использованию не допускается.`;
  }
}

/* ================= ИНИЦИАЛИЗАЦИЯ ================= */
renderWeight();
updateResult();
</script>
</body>
</html>
